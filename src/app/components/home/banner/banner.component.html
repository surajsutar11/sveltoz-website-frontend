<owl-carousel-o [options]="customOptions" class="banner-carousel">
  <ng-template carouselSlide>
    <div class="slide-container position-relative overflow-hidden">
      <!-- 🔹 Background Video -->
      <!-- <video autoplay muted loop playsinline class="background-video">
        <source src="assets/images/slider/neuronvid.mp4" type="video/mp4" />
      </video> -->

      <!-- 🔹 Content -->
      <div class="content-wrapper slider-containent">
        <div class="text-section text-white">
          <h6 class="banner-name">{{ 'Banner.Slide1.Title' | translate }}</h6>

          <p class="banner-description mt-3" [innerHTML]="'Banner.Slide1.Description' | translate"></p>

          <!-- 🔹 Bullet Points Section -->
          <ul class="banner-bullets mt-3">
            <li>Predictive & Cognitive AI Solutions</li>
            <li>Computer Vision, NLP, and Deep Learning</li>
            <li>Intelligent Automation for Enterprises</li>
          </ul>

          <div class="banner-buttons mt-4">
            <a class="btn btn-outline-light me-3" href="#know-how">
              Know How <span class="arrow">➔</span>
            </a>
            <a class="btn btn-light text-dark" (click)="goToSuccessStories()">
              Success Stories <span class="arrow">➔</span>
            </a>
          </div>
        </div>

        <div class="image-section text-center" style="max-width: 444px;">
          <img src="assets/images/slider/ladyrobot.svg" alt="Product Engineering" class="slide-img img-fluid" />
        </div>
      </div>

    </div>
  </ng-template>
