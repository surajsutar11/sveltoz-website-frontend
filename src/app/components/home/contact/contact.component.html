<section class="contect-section" data-animate="fadeInUp">
  <div class="container">
    <div class="row">
      <div class="col-12 text-center">
        <h5 class="section-subtitle">Contact Us</h5>
      </div>
    </div>

<div class="contact-container">
  <!-- Left side: Image -->
  <div class="contact-image">
    <img src="assets/images/ssplImg/contact-us.jpg" alt="Contact Us">
  </div>

  <!-- Right side: Contact Form -->
  <div class="contact-form">
    <p>We’d love to hear from you! Please fill out the form below.</p>

    <form (ngSubmit)="onSubmit()" #contactForm="ngForm">
      <div class="form-group">
        <label>Name</label>
        <input type="text" name="name" ngModel required placeholder="Enter your name" />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" ngModel required placeholder="Enter your email" />
      </div>

      <div class="form-group">
        <label>Message</label>
        <textarea name="message" ngModel required rows="4" placeholder="Type your message..."></textarea>
      </div>

      <button type="submit" [disabled]="!contactForm.valid">Send Message</button>
    </form>
  </div>
</div>
</div>
</section>
