<div class="post-list">
  <div class="toolbar">
    <h2>Job Posts</h2>

    <div class="toolbar-actions">
      <button mat-flat-button color="primary" (click)="openAddDialog()">
        <i class="fa fa-plus"></i>
        Add Post
      </button>

      <div class="search-box">
        <label>Search</label>
        <input type="text" (keyup)="applyFilter($event)" placeholder="Title, company, location">
      </div>
    </div>
  </div>

  <mat-progress-bar *ngIf="isLoading" mode="indeterminate"></mat-progress-bar>

  <div class="table-wrapper" [hidden]="isLoading">
    <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z2">

      <!-- Sr No -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Sr.No.</th>
        <td mat-cell *matCellDef="let row; let i = index">
          {{ i + 1 }}
        </td>
      </ng-container>

      <!-- Title -->
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Title</th>
        <td mat-cell *matCellDef="let row">
          <div class="title-cell">
            <div class="title">{{ row.title }}</div>
            <div class="company">{{ row.company }}</div>
          </div>
        </td>
      </ng-container>

      <!-- Location -->
      <ng-container matColumnDef="location">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Location</th>
        <td mat-cell *matCellDef="let row">{{ row.location }}</td>
      </ng-container>

      <!-- Type -->
      <ng-container matColumnDef="job_type">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Type</th>
        <td mat-cell *matCellDef="let row">{{ row.job_type }}</td>
      </ng-container>

      <!-- Salary -->
      <ng-container matColumnDef="salary">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Salary</th>
        <td mat-cell *matCellDef="let row">{{ row.salary }}</td>
      </ng-container>

      <!-- Status -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
        <td mat-cell *matCellDef="let row">
          <span class="status-pill" [ngClass]="row.is_active ? 'open' : 'closed'">
            {{ row.is_active ? 'OPEN' : 'CLOSED' }}
          </span>
        </td>
      </ng-container>

      <!-- Created -->
      <ng-container matColumnDef="created_at">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Created</th>
        <td mat-cell *matCellDef="let row">
          {{ (row.updated_at + 'Z') | date:'medium':'+05:30':'en-US' }}
        </td>
      </ng-container>

      <!-- Actions -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button class="edit-btn" (click)="openEditDialog(row)">
            <i class="fa fa-edit"></i>
          </button>

          <button mat-icon-button class="delete-btn" (click)="deletePost(row)">
            <i class="fa fa-trash"></i>
          </button>
        </td>
      </ng-container>

      <!-- Header & Row -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell no-data-cell" [attr.colspan]="displayedColumns.length">
          No job posts found
        </td>
      </tr>

    </table>

    <div class="paginator-card">
      <mat-paginator [length]="dataSource.filteredData.length" [pageSize]="10" [pageSizeOptions]="[5, 10, 25, 50]"
        showFirstLastButtons>
      </mat-paginator>
    </div>
  </div>
</div>
