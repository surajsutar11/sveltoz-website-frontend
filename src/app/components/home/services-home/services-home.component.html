<section class="services-section" data-animate="fadeInUp">
  <div class="container">
    <div class="row">
      <div class="col-12 text-center">
        <h2 class="section-subtitle">Our Services</h2>
        <p class="intro">
          Discover our end-to-end technology expertise — from intelligent AI solutions to
          enterprise-grade software systems, cloud infrastructure, and innovation consulting.
        </p>
      </div>
    </div>
    <div class="services-container">
      <div class="service-card" *ngFor="let category of services">
        <h3>{{ category.title }}</h3>
        <ul class="points">
          <li *ngFor="let item of category.points">
            {{ item }}
          </li>
        </ul>
      </div>
    </div>
  </div>
</section>
