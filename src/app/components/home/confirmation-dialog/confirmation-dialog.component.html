<div class="confirm-dialog">
  <h2>Delete Job Post</h2>

  <p>Are you sure you want to delete this job post?</p>

  <div class="dialog-actions">
    <button mat-stroked-button class="cancel-btn" [mat-dialog-close]="false">
      Cancel
    </button>
    <button mat-flat-button class="delete-btn" [mat-dialog-close]="true">
      Delete
    </button>
  </div>
</div>
