<section class="auth-section" data-animate="fadeInUp">
  <div class="container">
    <div class="row">
      <div class="col-12 text-center">
        <h2 class="section-title">Login to Your Account</h2>
      </div>
    </div>

    <div class="auth-container">
      <!-- Left side: Image -->
      <div class="auth-image">
        <img src="assets/images/ssplImg/login.png" alt="Login Illustration" />
      </div>
      <div class="auth-form">
        <p class="auth-text">
          Please enter your credentials to access the admin panel.
        </p>
        <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
          <div class="form-group">
            <label>Email</label>
            <input
              type="email"
              formControlName="email"
              placeholder="Enter your email"
            />
            <div class="error" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
              Valid email is required
            </div>
          </div>

          <div class="form-group">
            <label>Password</label>
            <input
              type="password"
              formControlName="password"
              placeholder="Enter your password"
            />
            <div class="error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
              Password is required
            </div>
          </div>

          <div class="form-footer">
            <div class="remember">
              <input type="checkbox" formControlName="remember" id="rememberMe" />
              <label for="rememberMe" class="remember-me-label">Remember me</label>
            </div>
            <a class="forgot-link" href="javascript:void(0)">Forgot password?</a>
          </div>

          <button type="submit" [disabled]="loginForm.invalid || isLoading">
            <span *ngIf="!isLoading">Login</span>
            <span *ngIf="isLoading">Logging in...</span>
          </button>

          <div class="server-error" *ngIf="errorMessage">
            {{ errorMessage }}
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
